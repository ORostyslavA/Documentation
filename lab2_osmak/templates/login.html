{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="card-title mb-3">Login with Google</h2>
                <p class="text-muted mb-4">Увійдіть через Google.</p>
                <button id="login-button" class="btn btn-primary w-100">Login with Google</button>
                <div class="mt-3 text-muted small">Після успішного входу ви будете перенаправлені в додаток.</div>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD4MG9pFzdWLdl-VtlE6rYpBOUyZ8jqZCM",
    authDomain: "dock-lab3.firebaseapp.com",
    projectId: "dock-lab3",
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  document.getElementById('login-button').addEventListener('click', async () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
      const result = await auth.signInWithPopup(provider);
      const idToken = await result.user.getIdToken();
      const response = await fetch('/auth/firebase-login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ idToken })
      });

      if (response.ok) {
        window.location.href = '/';
      } else {
        const data = await response.json();
        alert('Login failed: ' + (data.error || 'Unknown error'));
      }
    } catch (error) {
      alert('Login error: ' + error.message);
    }
  });
</script>
{% endblock %}
